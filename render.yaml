services:
  - type: web
    name: empresa-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false  # Se configura manualmente
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: FLASK_ENV
        value: production

  - type: pserv
    name: empresa-db
    databaseName: empresa
    plan: free  # Cambiar a starter si necesitas más espacio