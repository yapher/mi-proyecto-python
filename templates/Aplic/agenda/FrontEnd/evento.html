<!-- Modal UNIFICADO (Estilo Pagos) -->
<div class="modal fade" id="modalEvento" tabindex="-1" aria-labelledby="modalEventoLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content" style="background-color: #4b376a; color: #fff; border-radius: 1rem; box-shadow: 0 8px 32px rgba(136,201,153,0.16);">
            <div class="modal-header" style="border-bottom: 2px solid #88c999; background: linear-gradient(to right, #2a1e3b, #3e2d59); border-top-left-radius: 1rem; border-top-right-radius: 1rem;">
                <h5 class="modal-title" id="modalEventoLabel" style="color: #88c999; font-weight: 700;">Evento</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar" style="filter: invert(1);"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="eventoId" />
                <div class="mb-3">
                    <label class="form-label" style="color: #e5d64f;">Título</label>
                    <input type="text" id="titulo" class="form-control" placeholder="Ej: Reunión con equipo" required style="background: #3e2d59; color: #fff; border: 1px solid #88c999;" />
                </div>
                <div class="mb-3">
                    <label class="form-label" style="color: #e5d64f;">Fecha</label>
                    <input type="date" id="fecha" class="form-control" required style="background: #3e2d59; color: #fff; border: 1px solid #88c999;" />
                </div>
                <div class="mb-3">
                    <label class="form-label" style="color: #e5d64f;">Descripción</label>
                    <textarea id="descripcion" class="form-control" placeholder="Detalles opcionales del evento" style="background: #3e2d59; color: #fff; border: 1px solid #88c999;"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label" style="color: #e5d64f;">Email (para recordatorio)</label>
                    <input type="email" id="email" class="form-control" placeholder="usuario@dominio.com" required list="lista-emails" style="background: #3e2d59; color: #fff; border: 1px solid #88c999;" />
                    <datalist id="lista-emails"></datalist>
                    <div class="form-text" style="color: #ccc;">Se enviará un correo <strong>un día antes</strong> del evento a las 08:00 (hora AR).</div>
                </div>
                <div class="form-check mt-2">
                    <input type="checkbox" class="form-check-input" id="realizado">
                    <label for="realizado" class="form-check-label" style="color: #fff;">Evento realizado</label>
                </div>
                <div class="mb-3 mt-3">
                    <label class="form-label" style="color: #e5d64f;">Prioridad</label>
                    <select id="prioridad" class="form-select" style="background: #3e2d59; color: #fff; border: 1px solid #88c999;">
                        <option value="alta">Alta</option>
                        <option value="media" selected>Media</option>
                        <option value="baja">Baja</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer" style="border-top: 2px solid #88c999;">
                <button class="btn btn-agregar" onclick="guardarEvento()">Guardar</button>
                <button class="btn btn-eliminar" onclick="eliminarEvento()">Eliminar</button>
            </div>
        </div>
    </div>
</div>
<script src="/static/js/apps/evento.js"></script>
