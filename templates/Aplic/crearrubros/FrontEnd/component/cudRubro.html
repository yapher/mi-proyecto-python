<!-- Botón para abrir modal -->
<div class="mb-3">
    <button type="button" class="btn btn-agregar" id="btnAbrirModal"
            data-bs-toggle="modal" data-bs-target="#rubroModal">
        Agregar nuevo rubro
    </button>
</div>

<!-- Modal -->
<div class="modal fade" id="rubroModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content bg-form">
            <div class="modal-header">
                <h5 class="modal-title" id="rubroModalLabel">Gestión de Rubros</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"
                        aria-label="Cerrar" style="filter: invert(1);"></button>
            </div>
            <div class="modal-body">
                <form id="formulario" onsubmit="return false;">
                    {% include "Aplic/crearrubros/FrontEnd/component/selectRubros.html" %}

                    <div class="mb-3 input-with-emoji">
                        <span class="input-emoji">📛</span>
                        <input type="text" class="form-control ps-5" id="nombre"
                               placeholder="Nombre del rubro">
                    </div>
                    <div class="mb-3 input-with-emoji">
                        <span class="input-emoji">😀</span>
                        <input type="text" class="form-control ps-5" id="emoji"
                               placeholder="Emoji">
                    </div>
                    <div class="mb-3 input-with-emoji">
                        <span class="input-emoji">🔗</span>
                        <input type="text" class="form-control ps-5" id="ruta_menu"
                               placeholder="Ruta (opcional)">
                    </div>
                    <input type="hidden" id="ruta_original">

                    <div class="button-group d-flex gap-2 justify-content-end mt-4">
                        <button type="button" class="btn btn-agregar" id="btnAgregar">
                            Agregar
                        </button>
                        <button type="button" class="btn btn-editar" id="btnEditar"
                                style="display:none;">
                            Guardar
                        </button>
                        <button type="button" class="btn btn-cancelar" id="btnCancelar"
                                style="display:none;">
                            Cancelar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
