{% extends 'layout.html' %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('indexestadistica_de_paradas.static', filename='css/estadistica_de_paradas.css') }}">
{% endblock %}
{% block content %}
<div class="estadistica_de_paradas-container">
    <div class="chart-section-header">
        <h1>Estadística de Paradas</h1>
    </div>

    <div class="chart-controls">
        <div class="chart-file-upload">
            <label for="archivoInput">📁 Cargar Archivo</label>
            <input type="file" id="archivoInput" accept=".txt" style="display: none;">
            <span id="nombreArchivo" class="file-name"></span>
        </div>

        <div class="chart-date-filter">
            <label for="fechaInicio">Desde:</label>
            <input type="date" id="fechaInicio">
            <label for="fechaFin">Hasta:</label>
            <input type="date" id="fechaFin">
            <button id="btnFiltrarFechas" class="btn btn-filtrar btn-sm">Filtrar</button>
            <button id="btnLimpiarFechas" class="btn btn-cancelar btn-sm">Limpiar</button>
        </div>

        <label for="columnaSelect">Agrupar por:</label>
        <select id="columnaSelect">
            {% for col in columnas %}
            <option value="{{ col.key }}">{{ col.nombre }}</option>
            {% endfor %}
        </select>

        <button id="exportarPdf" class="btn btn-exportar btn-sm">Exportar a PDF</button>
    </div>

    <div id="grafico" class="chart-container">
        <div id="graficoTorta" class="chart-box"></div>
        <div id="graficoBarras" class="chart-box"></div>
    </div>
</div>

<script>
    window.datos_iniciales = {{ datos_iniciales | safe }};
    window.rango_fechas = {{ rango_fechas | safe }};
</script>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('indexestadistica_de_paradas.static', filename='js/estadistica_de_paradas.js') }}"></script>
{% endblock %}
