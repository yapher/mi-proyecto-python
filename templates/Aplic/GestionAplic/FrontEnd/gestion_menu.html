{% extends 'layout.html' %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('menu_api.static', filename='css/gestion_menu.css') }}">
{% endblock %}
{% block content %}
<h3 class="mb-3">Gestión de Menú</h3>
<div class="bg-form mb-4">
    <form id="formulario">
        <!-- Selectores multinivel -->
        <div id="nivelesContainer" class="mb-3"></div>

        <!-- Nombre, emoji y ruta -->
        <div class="mb-3 input-with-emoji">
            <span class="input-emoji">📛</span>
            <input type="text" class="form-control ps-5" id="nombre" placeholder="Nombre del ítem">
        </div>
        <div class="mb-3 input-with-emoji">
            <span class="input-emoji">😀</span>
            <input type="text" class="form-control ps-5" id="emoji" placeholder="Emoji">
        </div>
        <div class="mb-3 input-with-emoji">
            <span class="input-emoji">🔗</span>
            <input type="text" class="form-control ps-5" id="ruta_menu" placeholder="Ruta (opcional)">
        </div>

        <!-- ✅ NUEVO: Checkboxes de roles (más intuitivo que select multiple) -->
        <div class="mb-3">
            <label class="form-label" style="color: #e5d64f;">
                🔒 Roles permitidos
            </label>
            <div class="roles-container">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="roleAdmin" value="admin">
                    <label class="form-check-label" for="roleAdmin">
                        👑 Administrador
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="roleEditor" value="editor">
                    <label class="form-check-label" for="roleEditor">
                        ✏️ Editor
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="roleViewer" value="viewer">
                    <label class="form-check-label" for="roleViewer">
                        👁️ Viewer
                    </label>
                </div>
            </div>
            <small class="form-text" style="color: #b8b8b8;">
                <strong>Importante:</strong> Si <strong>NO seleccionás ningún rol</strong>, el ítem será visible para <strong>TODOS</strong> los usuarios autenticados.
            </small>
        </div>

        <input type="hidden" id="ruta_original">
        <div class="button-group">
            <button type="button" class="btn btn-agregar" onclick="guardar()">Agregar</button>
            <button type="button" class="btn btn-editar-menu" onclick="editar()">Guardar cambios</button>
            <button type="button" class="btn btn-cancelar-menu" onclick="cancelar()">Cancelar</button>
        </div>
    </form>
</div>

<div class="table-responsive tabla-scroll">
    <table class="table table-hover table-striped table-dark align-middle w-100 mb-0">
        <thead class="sticky-header">
            <tr>
                <th>Emoji</th>
                <th>Nombre</th>
                <th>Ruta</th>
                <th>Roles</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tabla">
            <!-- Se llena dinámicamente -->
        </tbody>
    </table>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('menu_api.static', filename='js/gestion_menu.js') }}"></script>
{% endblock %}
