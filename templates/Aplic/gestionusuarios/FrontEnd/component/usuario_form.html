<!-- Modal de formulario para crear/editar usuario -->
<div class="modal fade modal-custom-dark" id="modalUsuario" tabindex="-1" aria-labelledby="modalUsuarioLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <form id="formUsuario">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalUsuarioLabel">Agregar Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="usuarioId" name="id">

                    <!-- Username -->
                    <div class="mb-3 input-with-emoji">
                        <span class="input-emoji">👤</span>
                        <label for="username" class="form-label">Usuario</label>
                        <input type="text" class="form-control ps-5" id="username" name="username" placeholder="Nombre de usuario" required>
                    </div>

                    <!-- Password -->
                    <div class="mb-3 input-with-emoji">
                        <span class="input-emoji">🔒</span>
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control ps-5" id="password" name="password" placeholder="Mínimo 4 caracteres">
                        <small class="form-text text-muted">Dejar vacío para no cambiar (en modo edición)</small>
                    </div>

                    <!-- Roles -->
                    <div class="mb-3">
                        <label class="form-label">🔒 Roles</label>
                        <div class="roles-container">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="roleAdmin" value="admin">
                                <label class="form-check-label" for="roleAdmin">
                                    👑 Administrador
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="roleEditor" value="editor">
                                <label class="form-check-label" for="roleEditor">
                                    ✏️ Editor
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="roleViewer" value="viewer">
                                <label class="form-check-label" for="roleViewer">
                                    👁️ Viewer
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-cancelar" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-guardar" id="btnGuardarUsuario">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
