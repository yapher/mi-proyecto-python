<div class="modal fade" id="modalCambiarPassword" tabindex="-1" aria-labelledby="modalCambiarPasswordLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="formCambiarPassword">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalCambiarPasswordLabel">
                        <i class="bi bi-shield-lock-fill"></i> Cambiar Contraseña
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="passwordActual" class="form-label">Contraseña Actual</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" id="passwordActual" name="password_actual" class="form-control" required>
                            <button type="button" class="btn btn-outline-secondary btn-toggle-pass" data-target="passwordActual">
                                <i class="bi bi-eye-fill"></i>
                            </button>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="passwordNueva" class="form-label">Nueva Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                            <input type="password" id="passwordNueva" name="password_nueva" class="form-control" required minlength="4">
                            <button type="button" class="btn btn-outline-secondary btn-toggle-pass" data-target="passwordNueva">
                                <i class="bi bi-eye-fill"></i>
                            </button>
                        </div>
                        <small class="form-text text-muted">Mínimo 4 caracteres</small>
                    </div>
                    <div class="mb-3">
                        <label for="passwordConfirmar" class="form-label">Confirmar Nueva Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-check-circle-fill"></i></span>
                            <input type="password" id="passwordConfirmar" name="password_confirmar" class="form-control" required minlength="4">
                            <button type="button" class="btn btn-outline-secondary btn-toggle-pass" data-target="passwordConfirmar">
                                <i class="bi bi-eye-fill"></i>
                            </button>
                        </div>
                    </div>
                    <div id="passwordStrength" class="password-strength"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-cancelar" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-guardar">
                        <i class="bi bi-check-circle-fill"></i> Cambiar Contraseña
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
