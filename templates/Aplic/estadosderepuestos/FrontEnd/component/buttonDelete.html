<button type="button" class="btn btn-eliminar btn-sm" title="Eliminar"
    onclick="Notify.delete('este repuesto', function() {
        document.getElementById('form-eliminar-{{ r.codigo }}').submit();
    })">
    Eliminar
</button>
<form id="form-eliminar-{{ r.codigo }}" method="POST"
    action="{{ url_for('indexEstadoRep.eliminar_repuesto') }}" style="display:none;">
    <input type="hidden" name="codigo" value="{{ r.codigo }}">
    <input type="hidden" name="return_to" value="{{ return_to | default('indexEstadoRep.indexEstadoRep') }}">
</form>
