<form method="POST" action="{{ url_for('indexEstadoRep.eliminar_repuesto') }}" style="display:inline;"
onsubmit="return confirm('¿Seguro que deseas eliminar este repuesto?');">
<input type="hidden" name="codigo" value="{{ r.codigo }}">
<input type="hidden" name="return_to" value="{{ return_to | default('indexEstadoRep.indexEstadoRep') }}">
<button type="submit" class="btn btn-eliminar btn-sm" title="Eliminar">
🗑️ Eliminar
</button>
</form>
