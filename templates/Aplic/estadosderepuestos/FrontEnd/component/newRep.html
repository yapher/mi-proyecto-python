<div class="modal fade modal-custom-dark" id="agregarModal" tabindex="-1" aria-labelledby="agregarModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <form method="POST" action="{{ url_for('indexEstadoRep.agregar_repuesto') }}" enctype="multipart/form-data" id="formAgregarRepuesto">
                <div class="modal-header">
                    <h5 class="modal-title" id="agregarModalLabel">Agregar Nuevo Repuesto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="tab_activo" name="tab_activo">
                    
                    <div class="mb-3">
                        <label class="form-label">Imagen actual</label><br>
                        <img id="imgPreview" style="max-width:100px;display:none;">
                        <span id="imgNombre" style="color:#e5d64f;"></span>
                    </div>
                    
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="codigo" class="form-label">Código</label>
                        <input type="text" class="form-control" id="codigo" name="codigo" required>
                        <input type="hidden" id="codigo_original" name="codigo_original">
                    </div>
                    
                    <div class="mb-3">
                        <label for="cantidad" class="form-label">Cantidad</label>
                        <input type="number" class="form-control" id="cantidad" name="cantidad" min="1" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="equipo" class="form-label">ALMACÉN</label>
                        <select class="form-select" id="equipo" name="equipo">
                            <option value="">-- Selecciona un equipo --</option>
                            {% for nombre in nombres_almacenes %}
                            <option value="{{ nombre }}">{{ nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="ubicacion" class="form-label">Ubicación Técnica</label>
                        <select class="form-select" id="ubicacion" name="ruta_jerarquia[]" multiple style="width: 100%;">
                            <option value="">-- Seleccionar ubicaciones técnica --</option>
                            {% for ubic in ubicaciones %}
                            <option value="{{ ubic }}">{{ ubic }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="imagen" class="form-label">Imagen (opcional)</label>
                        <input type="file" class="form-control" id="imagen" name="imagen" accept="image/*">
                    </div>
                    
                    <div class="mb-3">
                        <label for="fecha_creacion" class="form-label">Fecha de Creación</label>
                        <input type="date" class="form-control" id="fecha_creacion" name="fecha_creacion" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="fecha_fin" class="form-label">Fecha Fin (opcional)</label>
                        <input type="date" class="form-control" id="fecha_fin" name="fecha_fin">
                    </div>
                    
                    <div class="mb-3">
                        <label for="link" class="form-label">Link (opcional)</label>
                        <input type="url" class="form-control" id="link" name="link" placeholder="https://">
                    </div>
                    
                    <div class="mb-3">
                        <label for="estado" class="form-label">Estado</label>
                        <select class="form-select" id="estado" name="estado">
                            <option value="">-- Todos los estados --</option>
                            {% for estado in estados %}
                            <option value="{{ estado.emoji }}">{{ estado.nombre }} {{ estado.emoji }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar Repuesto</button>
                </div>
            </form>
        </div>
    </div>
</div>
<input type="hidden" id="editar-repuesto-url" value="{{ url_for('indexEstadoRep.editar_repuesto') }}">
<script src="/static/js/apps/newRep.js"></script>
