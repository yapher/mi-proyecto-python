<!-- Modal de Gestión de Almacenes -->
<div class="modal fade modal-custom-dark" id="modalGestionAlmacenes" tabindex="-1"
     aria-labelledby="modalGestionAlmacenesLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalGestionAlmacenesLabel">
                    🏗️ Gestión de Almacenes
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <div class="row g-3">
                    <!-- Columna izquierda: Formulario -->
                    <div class="col-lg-5">
                        <div class="bg-form p-3 rounded">
                            <h6 class="text-white mb-3">Nuevo / Editar Almacén</h6>
                            <form id="formAlmacen" onsubmit="return false;">
                                <!-- Selectores multinivel -->
                                <label for="almacenesNivelesContainer" class="form-label" style="color: #e5d64f;">
                                    Almacén Padre
                                </label>
                                <div id="almacenesNivelesContainer" class="mb-3"></div>

                                <div class="mb-3 input-with-emoji">
                                    <label for="almacenNombre" class="form-label">Nombre</label>
                                    <span class="input-emoji">📛</span>
                                    <input type="text" class="form-control ps-5" id="almacenNombre"
                                           placeholder="Nombre del almacén">
                                </div>
                                <div class="mb-3 input-with-emoji">
                                    <label for="almacenEmoji" class="form-label">Emoji</label>
                                    <span class="input-emoji">😀</span>
                                    <input type="text" class="form-control ps-5" id="almacenEmoji"
                                           placeholder="Emoji">
                                </div>
                                <div class="mb-3 input-with-emoji">
                                    <label for="almacenRuta" class="form-label">Descripción</label>
                                    <span class="input-emoji">🔗</span>
                                    <input type="text" class="form-control ps-5" id="almacenRuta"
                                           placeholder="Ruta (opcional)">
                                </div>
                                <input type="hidden" id="almacenRutaOriginal">

                                <div class="button-group d-flex gap-2 flex-wrap">
                                    <button type="button" class="btn btn-agregar" id="btnAlmacenAgregar">
                                        Agregar
                                    </button>
                                    <button type="button" class="btn btn-editar" id="btnAlmacenEditar"
                                            style="display:none;">
                                        Guardar cambios
                                    </button>
                                    <button type="button" class="btn btn-cancelar" id="btnAlmacenCancelar"
                                            style="display:none;">
                                        Cancelar
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                    <!-- Columna derecha: Tabla jerárquica -->
                    <div class="col-lg-7">
                        <h6 class="text-white mb-3">Almacenes existentes</h6>
                        <div class="table-responsive tabla-scroll" style="max-height: 50vh;">
                            <table class="table table-hover table-striped table-dark align-middle w-100 mb-0">
                                <thead class="sticky-header">
                                    <tr>
                                        <th>Emoji</th>
                                        <th>Almacén</th>
                                        <th>Descripción</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="almacenesTabla"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-cancelar" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>
