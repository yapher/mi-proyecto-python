{% extends 'layout.html' %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/apps/crear_ubicacion_tecnica.css') }}">
{% endblock %}
{% block content %}
<h3 class="mb-3">Ubicaciones Técnicas</h3>

<div class="bg-form mb-4">
    <form id="formulario">
        <!-- Selectores multinivel -->
         <label for="nivelesContainer" class="form-label">Ubicaciones Técnicas</label>
        <div id="nivelesContainer" class="mb-3"></div>

        <!-- Nombre, emoji y ruta -->
        <div class="mb-3 input-with-emoji">
            <label for="nombre" class="form-label">NOMBRE DE UBICACIÓN TÉCNICA/EQUIPO</label>
            <span class="input-emoji">📛</span>
            <input type="text" class="form-control ps-5" id="nombre" placeholder="Nombre del ítem">
        </div>

        <div class="mb-3 input-with-emoji">
            <label for="emoji" class="form-label">IMAGEN</label>
            <span class="input-emoji">😀</span>
            <input type="text" class="form-control ps-5" id="emoji" placeholder="Emoji">
        </div>

        <div class="mb-3 input-with-emoji">
            <label for="ruta_ubicacion" class="form-label">DESCRIPCIÓN</label>
            <span class="input-emoji">🔗</span>
            <input type="text" class="form-control ps-5" id="ruta_ubicacion" placeholder="Ruta (opcional)">
        </div>

        <input type="hidden" id="ruta_original">
        <div class="button-group">
            <button type="button" class="btn-agregar" onclick="guardar()">Agregar</button>
            <button type="button" class="btn-guardar" onclick="editar()">Guardar
                cambios</button>
            <button type="button" class="btn btn-cancelar" onclick="cancelar()">Cancelar</button>
        </div>
    </form>
</div>

<div class="table-responsive tabla-scroll">
    <table class="table table-hover table-striped table-dark align-middle w-100 mb-0">
        <thead class="sticky-header">
            <tr>
                <th>IMAGEN</th>
                <th>UBICACIÓN TÉCNICA / EQUIPO</th>
                <th>DESCRIPCIÓN</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tabla">
            <!-- Se llena dinámicamente -->
        </tbody>
    </table>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/apps/crear_ubicacion_tecnica.js') }}"></script>
{% endblock %}
