{% extends 'layout.html' %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('indexlistar_ot.static', filename='css/listar_ot.css') }}">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts-gl@2.0.9/dist/echarts-gl.min.js"></script>
{% endblock %}

{% block content %}
<div class="listarot-container">
    <h1 class="titulo-principal">📋 Órdenes de Mantenimiento</h1>
    <h2 id="contador-filas" class="contador-ot">
        Cantidad total de órdenes: {{ num_filas }}
    </h2>

    <div class="mb-3 text-center">
        <label class="text-white me-2">📁 Archivo:</label>
        <select id="archivoSelector" class="form-select d-inline-block w-auto" onchange="cambiarArchivo()">
            {% for archivo, fecha in selector %}
            <option value="{{ archivo }}" {% if archivo == archivo_actual %}selected{% endif %}>
                {{ fecha }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="grafico-box">
        <div id="graficoTorta"></div>
        <div id="graficoModo" class="modo-indicator"></div>
    </div>

    <div class="row g-2 controles-container">
        <div class="col-md-6">
            <select id="columnaSelector" class="form-select" onchange="generarGrafico()">
                <option value="">📊 Seleccionar columna a graficar</option>
            </select>
        </div>
        <div class="col-md-6">
            <input type="text" id="busqueda" class="form-control" onkeyup="buscar()"
                placeholder="🔍 Buscar en la tabla..." />
        </div>
    </div>

    <div class="table-responsive tabla-scroll mt-3">
        {% set safe_tables = tables | replace('><td></td><', '><td>sin valor</td><') %}
        {{ safe_tables | safe }}
    </div>
</div>

<div id="modalContainer"></div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('indexlistar_ot.static', filename='js/listar_ot.js') }}"></script>
{% endblock %}
