{% extends 'layout.html' %}

{% block content %}
<div class="tareas-container">
    <h3 class="mb-4">📋 Tareas</h3>

    <!-- Formulario de agregar rápido -->
    <div class="tareas-form bg-form mb-4 p-3 rounded">
        <form id="formAgregarTarea" class="row g-2 align-items-end">
            <div class="col-md-4 col-12">
                <label class="form-label text-white small">Título</label>
                <input type="text" id="titulo" name="titulo"
                       placeholder="Ej: Reunión con equipo"
                       class="form-control" required>
            </div>
            <div class="col-md-3 col-6">
                <label class="form-label text-white small">Fecha</label>
                <input type="date" id="fecha" name="fecha"
                       class="form-control" required>
            </div>
            <div class="col-md-3 col-6">
                <label class="form-label text-white small">Descripción</label>
                <input type="text" id="descripcion" name="descripcion"
                       placeholder="Detalles opcionales"
                       class="form-control">
            </div>
            <div class="col-md-2 col-12">
                <button type="submit" class="btn btn-agregar w-100">
                    Agregar
                </button>
            </div>
        </form>
    </div>

    <!-- Lista de tareas -->
    <ul id="listaTareas" class="event-list">
        <li class="text-center text-muted py-4">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <p class="mt-2">Cargando tareas...</p>
        </li>
    </ul>
</div>

<!-- Modal de edición -->
<div class="modal fade modal-custom-dark" id="modalEditarTarea"
     tabindex="-1" aria-labelledby="modalEditarTareaLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <form id="formEditarTarea">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalEditarTareaLabel">Editar Tarea</h5>
                    <button type="button" class="btn-close"
                            data-bs-dismiss="modal" aria-label="Cerrar"
                            style="filter: invert(1);"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="edit-id" name="id">
                    <div class="mb-3">
                        <label for="edit-titulo" class="form-label">Título</label>
                        <input type="text" id="edit-titulo" name="titulo"
                               required class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="edit-fecha" class="form-label">Fecha</label>
                        <input type="date" id="edit-fecha" name="fecha"
                               required class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="edit-descripcion" class="form-label">Descripción</label>
                        <textarea id="edit-descripcion" name="descripcion"
                                  rows="4" class="form-control"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-eliminar" id="btnEliminarTarea">
                        Eliminar
                    </button>
                    <button type="button" class="btn btn-cancelar" data-bs-dismiss="modal">
                        Cancelar
                    </button>
                    <button type="submit" class="btn btn-guardar">
                        Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<link rel="stylesheet" href="{{ url_for('indextareas.static', filename='css/tareas.css') }}">
{% endblock %}

{% block scripts %}
<script src="{{ url_for('indextareas.static', filename='js/tareas.js') }}"></script>
{% endblock %}
