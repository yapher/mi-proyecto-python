<div class="modal fade modal-custom-dark" id="sensorMenu" tabindex="-1" aria-labelledby="sensorMenuLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="sensorMenuLabel">Opciones del Sensor</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <div class="d-flex flex-row gap-2 mb-3">
                    <button type="button" class="btn btn-warning btn-sm btn-editar" onclick="renombrarSensor()">✏️ Renombrar</button>
                    <button type="button" class="btn btn-eliminar btn-sm" onclick="eliminarSensor()">🗑️ Eliminar</button>
                </div>
                <div class="mb-3">
                    <label class="form-label">🎨 Color</label>
                    <input type="color" id="colorPicker" class="form-control form-control-color" onchange="cambiarColorDesdePicker()">
                </div>
                <div class="mb-3" onclick="cambiarForma()" style="cursor: pointer; padding: 0.375rem 0.75rem; border: 1px solid #88c999; border-radius: 0.25rem; background-color: #3e2d59; color: #fff;">
                    🔷 Cambiar Forma
                </div>
                <div class="mb-3">
                    <label class="form-label">📏 Tamaño</label>
                    <input type="number" id="sizeInput" class="form-control" min="0.1" max="5" step="0.1" onchange="cambiarTamañoSensor()">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-cancelar" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>
