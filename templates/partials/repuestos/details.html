<!-- Modal detalle de repuesto -->
<div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="productModalLabel">Detalle del Repuesto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>

            <div class="modal-body">
                <div class="row g-4">
                    <div class="col-md-4 text-center">
                        <img id="modalImage" src="" alt="Imagen del repuesto" class="rep-detalle-imagen">
                    </div>

                    <div class="col-md-8">
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item">
                                <strong>Nombre:</strong>
                                <span id="modalTitle"></span>
                            </li>

                            <li class="list-group-item">
                                <strong>Código:</strong>
                                <span id="modalCodigo"></span>
                            </li>

                            <li class="list-group-item">
                                <strong>Cantidad:</strong>
                                <span id="modalCantidad"></span>
                            </li>

                            <li class="list-group-item">
                                <strong>Fecha de alta:</strong>
                                <span id="modalFecha"></span>
                            </li>

                            <li class="list-group-item" id="modalFechaFinLi" style="display:none;">
                                <strong>Fecha de baja:</strong>
                                <span id="modalFechaFin"></span>
                            </li>

                            <li class="list-group-item">
                                <strong>Almacén:</strong>
                                <span id="modalEquipo"></span>
                            </li>

                            <li class="list-group-item">
                                <strong>Ubicación Técnica:</strong>
                                <span id="modalUbicacion" class="rep-detalle-ubicacion"></span>
                            </li>

                            <li class="list-group-item">
                                <strong>Estado:</strong>
                                <span id="modalEmojy"></span>
                            </li>

                            <li class="list-group-item">
                                <strong>Link:</strong>
                                <span id="modalLink"></span>
                            </li>

                            <li class="list-group-item" id="modalComentarioLi" style="display:none;">
                                <strong>Comentario:</strong>
                                <span id="modalComentario" class="rep-detalle-comentario"></span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="modal-footer border-0">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<script defer src="{{ url_for('static', filename='js/utils/repuesto_details_modal.js') }}"></script>
