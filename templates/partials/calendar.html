{# templates/partials/calendar.html #}
{% set container_id = container_id|default('calendario') %}
{% set btn_agregar_text = btn_agregar_text|default('➕ Agregar Evento') %}

<div class="calendar-controls">
    <select id="mesSelect" class="form-select" aria-label="Mes">
        <option value="1">Enero</option>
        <option value="2">Febrero</option>
        <option value="3">Marzo</option>
        <option value="4">Abril</option>
        <option value="5">Mayo</option>
        <option value="6">Junio</option>
        <option value="7">Julio</option>
        <option value="8">Agosto</option>
        <option value="9">Septiembre</option>
        <option value="10">Octubre</option>
        <option value="11">Noviembre</option>
        <option value="12">Diciembre</option>
    </select>
    
    <select id="anioSelect" class="form-select" aria-label="Año">
        {% for anio in range(2020, 2031) %}
            <option value="{{ anio }}">{{ anio }}</option>
        {% endfor %}
    </select>
    
    <button class="btn btn-agregar" id="btnAgregarEvento">
        {{ btn_agregar_text }}
    </button>
</div>

<div class="calendar-table-wrapper">
    <div id="{{ container_id }}"></div>
</div>
